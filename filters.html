<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ICONS 2027 · HALL 2 · Filters</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
    --ink:#0b1220;
    --ink-2:#475569;
    --ink-3:#94a3b8;
    --line:#e8edf3;
    --paper:#ffffff;
    --bg:#eef1f5;
    --sold:#e0484d;
    --seller:#7c3aed;
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --shadow-lg:0 24px 60px -12px rgba(11,18,32,.28), 0 8px 20px -8px rgba(11,18,32,.16);
    --shadow-md:0 10px 30px -8px rgba(11,18,32,.18), 0 3px 10px -4px rgba(11,18,32,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);-webkit-font-smoothing:antialiased}

#stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
#container{position:absolute;top:0;left:0;transform-origin:0 0}
#container.animate{transition:transform .34s cubic-bezier(.22,1,.36,1)}
#map-img{display:block;width:100%;height:100%;max-width:none;user-select:none;-webkit-user-drag:none}
#capa-mesas,#capa-sellers{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#capa-sellers{z-index:40}

#stage{cursor:grab}
#stage.dragging{cursor:grabbing}

/* ---------------- MESAS ---------------- */
.mesa{
    position:absolute;box-sizing:border-box;
    border:1px solid rgba(0,0,0,.12);
    border-radius:2px;
    pointer-events:auto;cursor:pointer;
    transition:filter .12s ease, box-shadow .12s ease;
}
.mesa:hover{filter:saturate(1.5) brightness(1.08);box-shadow:0 0 0 1.5px #fff, 0 0 0 3px rgba(11,18,32,.55);z-index:30}
.mesa.sold{cursor:default}
.mesa.dim{opacity:.22;filter:grayscale(1)}

/* ---------------- SELLERS ---------------- */
.sponsor-zone{position:absolute;pointer-events:auto;transition:transform .18s cubic-bezier(.2,.9,.3,1.2);cursor:pointer}
.sponsor-zone:hover{transform:scale(1.07);z-index:9000}
.sponsor-logo-box{width:100%;height:100%;background:#fff;border-radius:7px;box-shadow:0 3px 10px rgba(11,18,32,.18);display:flex;align-items:center;justify-content:center;padding:4px;border:1.5px solid #fff;transition:border-color .18s}
.sponsor-zone:hover .sponsor-logo-box{border-color:var(--seller)}
.sponsor-logo-box img{width:100%;height:100%;object-fit:contain}
.sponsor-logo-box.multi-logo{display:grid;gap:3px;align-items:stretch;justify-items:stretch}
.sponsor-logo-box.multi-logo img{min-width:0;min-height:0}
.layout-dual-horizontal{grid-template-columns:repeat(2,minmax(0,1fr))}
.layout-dual-vertical{grid-template-rows:repeat(2,minmax(0,1fr))}
.layout-triple-vertical{grid-template-rows:repeat(3,minmax(0,1fr))}
.layout-quad-vertical{grid-template-rows:repeat(4,minmax(0,1fr))}

/* ---------------- TOOLTIP (overlay fijo, tamaño constante) ---------------- */
.tip{
    position:fixed;z-index:12000;left:0;top:0;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:var(--shadow-lg);
    opacity:0;transform:translateY(6px) scale(.98);
    transition:opacity .14s ease, transform .14s ease;
    pointer-events:none;overflow:hidden;
}
.tip.show{opacity:1;transform:translateY(0) scale(1)}
.tip::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--accent,#94a3b8)}

#tip-mesa{width:288px}
.t-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px 0}
.t-id{font-size:21px;font-weight:800;letter-spacing:-.03em;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.t-cat{font-size:10.5px;font-weight:700;color:var(--ink-3);letter-spacing:.09em;text-transform:uppercase;margin-top:6px}
.t-pill{
    font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    padding:5px 9px;border-radius:999px;white-space:nowrap;flex:none;
    background:var(--accent-soft,#f1f5f9);color:var(--accent-ink,#334155);
}
.t-meta{display:flex;gap:0;margin:13px 16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.t-cell{flex:1;padding:9px 0;text-align:center;border-right:1px solid var(--line)}
.t-cell:last-child{border-right:none}
.t-k{display:block;font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.t-v{display:block;font-size:12.5px;font-weight:700;color:var(--ink);margin-top:3px;font-variant-numeric:tabular-nums;line-height:1.25;padding:0 4px}
.t-foot{padding:13px 16px 15px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.t-old{font-size:13px;font-weight:600;color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1.5px}
.t-new{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.t-eb{font-size:9px;font-weight:800;letter-spacing:.08em;background:#e7f8f2;color:#0f6b52;padding:4px 8px;border-radius:999px;text-transform:uppercase}
.t-sold{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sold)}
.t-sold::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--sold)}
.t-seller{padding:12px 16px 0;font-size:12px;font-weight:600;color:var(--ink-2)}
.t-seller b{color:var(--ink);font-weight:800}

#tip-seller{width:auto;min-width:190px;max-width:260px;pointer-events:auto}
#tip-seller::before{background:var(--seller)}
.s-name{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.02em;padding:16px 17px 0}
.s-tag{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:5px 17px 0}
.s-links{display:flex;flex-direction:column;gap:7px;padding:13px 15px 15px}
.s-btn{display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:9px;text-decoration:none;font-size:12.5px;font-weight:700;transition:all .16s;border:1px solid var(--line);color:var(--ink-2);background:#fafbfc}
.s-btn:hover{background:#fff;border-color:#cfd8e3;transform:translateY(-1px);box-shadow:var(--shadow-md)}
.s-btn svg,.s-btn img{width:16px;height:16px;object-fit:contain;flex:none}
.s-btn.ig:hover{border-color:#f0b3d0;color:#c02a63}

/* ---------------- CABECERA / LEYENDA ---------------- */
#hud{position:fixed;top:18px;left:18px;z-index:11000;display:flex;flex-direction:column;gap:10px;max-width:280px}
.card{background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.7);border-radius:14px;box-shadow:var(--shadow-md)}
#brand{padding:13px 15px}
#brand h1{margin:0;font-size:13.5px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
#brand p{margin:4px 0 0;font-size:10px;font-weight:700;color:var(--ink-3);letter-spacing:.07em;text-transform:uppercase;line-height:1.5}
#legend{padding:12px 15px 13px}
.lg-title{font-size:8.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px}
.lg-row{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:11.5px;font-weight:600;color:var(--ink-2);cursor:pointer;border-radius:6px;transition:background .12s}
.lg-row:hover{background:#f4f7fa}
.lg-row.off{opacity:.4}
.lg-sw{width:13px;height:13px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(11,18,32,.12)}
.lg-row b{color:var(--ink);font-weight:800;margin-left:auto;font-variant-numeric:tabular-nums;font-size:11px}
.lg-eb{margin-top:10px;font-size:8.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#0f6b52;background:#e7f8f2;padding:5px 9px;border-radius:999px;display:inline-block}
.lg-hint{margin-top:9px;font-size:9.5px;color:var(--ink-3);font-weight:600;line-height:1.5}
#simple-link{display:inline-block;margin-top:9px;font-size:10px;font-weight:800;color:var(--ink-2);text-decoration:none;letter-spacing:.04em;border-bottom:1px solid #cfd8e3;padding-bottom:1px}
#simple-link:hover{color:var(--ink);border-color:var(--ink)}

/* ---------------- ZOOM ---------------- */
#zoom{position:fixed;right:20px;bottom:20px;z-index:11000;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.7);border-radius:999px;box-shadow:var(--shadow-md)}
.zbtn{width:32px;height:32px;border-radius:50%;border:none;background:transparent;color:var(--ink-2);font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .14s,color .14s;font-family:var(--font);line-height:1}
.zbtn:hover{background:#eef2f6;color:var(--ink)}
.zbtn:active{background:#e2e8f0}
#z-track{height:158px;width:32px;display:flex;align-items:center;justify-content:center;position:relative}
#z-range{
    -webkit-appearance:none;appearance:none;
    width:150px;height:4px;border-radius:99px;background:#dde4ec;outline:none;
    transform:rotate(-90deg);cursor:pointer;
}
#z-range::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);cursor:grab;box-shadow:0 1px 4px rgba(11,18,32,.3)}
#z-range::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.12)}
#z-range::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);cursor:grab;box-shadow:0 1px 4px rgba(11,18,32,.3)}
#z-pct{font-size:9.5px;font-weight:800;color:var(--ink-3);font-variant-numeric:tabular-nums;letter-spacing:.02em;min-width:34px;text-align:center}
#z-fit{width:32px;height:32px;border-radius:50%;border:none;background:var(--ink);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .14s}
#z-fit:hover{transform:scale(1.08)}

#search{position:fixed;top:18px;right:20px;z-index:11000;display:flex;align-items:center;gap:8px;padding:9px 13px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.7);border-radius:999px;box-shadow:var(--shadow-md)}
#search svg{width:15px;height:15px;color:var(--ink-3);flex:none}
#search input{border:none;outline:none;background:transparent;font-family:var(--font);font-size:12.5px;font-weight:600;color:var(--ink);width:132px}
#search input::placeholder{color:var(--ink-3);font-weight:600}
#search-count{font-size:9.5px;font-weight:800;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:16px;text-align:right}

#loader{position:fixed;inset:0;z-index:30000;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;transition:opacity .4s;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
#loader.gone{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .4s, visibility 0s .4s}
.spin{width:26px;height:26px;border:2.5px solid #dde4ec;border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media(max-width:768px){
    #hud{top:10px;left:10px;max-width:calc(100vw - 20px)}
    #brand{padding:10px 12px}
    #legend{padding:10px 12px}
    #search{top:auto;bottom:18px;left:10px;right:auto;padding:8px 11px}
    #search input{width:104px}
    #zoom{right:10px;bottom:14px;padding:7px 6px;gap:4px}
    #z-track{height:104px}
    #z-range{width:96px}
    #tip-mesa{width:248px}
}
</style>
</head>
<body>

<div id="loader"><div class="spin"></div><span>Loading floor plan</span></div>

<div id="stage">
    <div id="container">
        <img id="map-img" alt="Hall 1 Floor Plan">
        <div id="capa-mesas"></div>
        <div id="capa-sellers"></div>
    </div>
</div>

<div id="hud">
    <div class="card" id="brand">
        <h1 id="hud-title">ICONS 2027 · HALL 1</h1>
        <p id="hud-sub"></p>
        <a href="index.html" id="simple-link">← Mapa simple</a>
    </div>
    <div class="card" id="legend">
        <div class="lg-title">Tables</div>
        <div id="lg-rows"></div>
        <div id="lg-eb" class="lg-eb"></div>
        <div class="lg-hint">Click a row to filter · scroll or drag the slider to zoom</div>
    </div>
</div>

<div id="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search-input" type="text" placeholder="Find a table…" autocomplete="off" spellcheck="false">
    <span id="search-count"></span>
</div>

<div id="zoom">
    <button class="zbtn" id="z-in" title="Zoom in">+</button>
    <div id="z-track"><input id="z-range" type="range" min="0" max="1000" value="0"></div>
    <button class="zbtn" id="z-out" title="Zoom out">−</button>
    <div id="z-pct">100%</div>
    <button id="z-fit" title="Fit to screen">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4M15 3h4a2 2 0 0 1 2 2v4M9 21H5a2 2 0 0 1-2-2v-4M15 21h4a2 2 0 0 0 2-2v-4"/></svg>
    </button>
</div>

<div class="tip" id="tip-mesa"></div>
<div class="tip" id="tip-seller"></div>

<script src="config.js"></script>
<script>
const C = window.ICONS_CONFIG;
const dict = new Map();

const stage      = document.getElementById('stage');
const container  = document.getElementById('container');
const mapImg     = document.getElementById('map-img');
const capaMesas  = document.getElementById('capa-mesas');
const capaSell   = document.getElementById('capa-sellers');
const tipMesa    = document.getElementById('tip-mesa');
const tipSeller  = document.getElementById('tip-seller');

mapImg.src = C.mapImage;
document.getElementById('hud-title').textContent = 'ICONS 2027 · ' + C.hallName + ' · Filtros';
document.getElementById('hud-sub').textContent = C.categories.map(c => c.label).join(' · ');

/* ============================ ZOOM ============================ */
const ZMAX = 8;             // 8 × la vista completa (por encima el navegador deja de rasterizar)
let fitScale = 1, zoom = 1, tx = 0, ty = 0;
let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;

const zRange = document.getElementById('z-range');
const zPct   = document.getElementById('z-pct');

function scale(){ return fitScale * zoom; }
function zoomToSlider(z){ return Math.round(1000 * Math.log(z) / Math.log(ZMAX)); }
function sliderToZoom(v){ return Math.pow(ZMAX, v / 1000); }

/* --- Escala "horneada" en el layout -------------------------------------
   Escalar con transform una imagen de 7499 px mantiene una capa
   compositada enorme y algunos móviles la dejan sin rasterizar (el plano
   se ve gris al alejar). El transform solo mueve y da fluidez mientras se
   arrastra el zoom; en cuanto para, el contenedor pasa a medir los píxeles
   reales y el navegador rasteriza la imagen en mosaico, como una normal. */
let baked = 0, bakeT = null;
function bake(){
    const s = scale();
    container.style.width  = (mapImg.naturalWidth  * s) + 'px';
    container.style.height = (mapImg.naturalHeight * s) + 'px';
    baked = s;
    container.classList.remove('animate');
    container.style.transform = `translate(${tx}px,${ty}px)`;
}
function bakeSoon(delay){
    clearTimeout(bakeT);
    bakeT = setTimeout(bake, delay);
}
function setTransform(animate){
    const k = baked ? scale() / baked : 1;
    container.classList.toggle('animate', !!animate);
    container.style.transform = `translate(${tx}px,${ty}px) scale(${k})`;
}
function applyTransform(animate){
    setTransform(animate);
    zPct.textContent = Math.round(zoom * 100) + '%';
    zRange.value = zoomToSlider(zoom);
    bakeSoon(animate ? 400 : 220);
}

function clampPan(){
    const w = mapImg.naturalWidth * scale();
    const h = mapImg.naturalHeight * scale();
    const vw = window.innerWidth, vh = window.innerHeight;
    const g = gutters();
    if (w <= vw - g.l - g.r) tx = g.l + (vw - g.l - g.r - w) / 2;
    else tx = Math.min(0, Math.max(vw - w, tx));
    if (h <= vh - g.t - g.b) ty = g.t + (vh - g.t - g.b - h) / 2;
    else ty = Math.min(0, Math.max(vh - h, ty));
}

function setZoom(z, cx, cy, animate){
    const nz = Math.min(ZMAX, Math.max(1, z));
    if (cx === undefined){ cx = window.innerWidth / 2; cy = window.innerHeight / 2; }
    const before = scale();
    const px = (cx - tx) / before, py = (cy - ty) / before;
    zoom = nz;
    const after = scale();
    tx = cx - px * after;
    ty = cy - py * after;
    clampPan();
    applyTransform(animate);
    hideTips();
}

/* hueco reservado para el panel izquierdo y la barra de zoom */
function gutters(){
    const wide = window.innerWidth >= 1080;
    return { l: wide ? 312 : 0, r: wide ? 76 : 0, t: 0, b: wide ? 0 : 74 };
}
function fit(animate){
    const iw = mapImg.naturalWidth || 7499, ih = mapImg.naturalHeight || 5675;
    const g = gutters();
    const availW = window.innerWidth - g.l - g.r;
    const availH = window.innerHeight - g.t - g.b;
    fitScale = Math.min(availW / iw, availH / ih) * 0.97;
    zoom = 1;
    tx = g.l + (availW - iw * fitScale) / 2;
    ty = g.t + (availH - ih * fitScale) / 2;
    if (animate && baked) applyTransform(true);
    else { clearTimeout(bakeT); bake(); zPct.textContent = '100%'; zRange.value = 0; }
}

zRange.addEventListener('input', () => setZoom(sliderToZoom(+zRange.value)));
document.getElementById('z-in').onclick  = () => setZoom(zoom * 1.45, undefined, undefined, true);
document.getElementById('z-out').onclick = () => setZoom(zoom / 1.45, undefined, undefined, true);
document.getElementById('z-fit').onclick = () => { fit(true); hideTips(); };

stage.addEventListener('wheel', e => {
    e.preventDefault();
    setZoom(zoom * (e.deltaY > 0 ? 0.86 : 1.16), e.clientX, e.clientY);
}, { passive:false });

stage.addEventListener('dblclick', e => {
    if (e.target.closest('.sponsor-zone')) return;
    setZoom(zoom < ZMAX * 0.5 ? zoom * 2.2 : 1, e.clientX, e.clientY, true);
});

/* --- arrastre --- */
stage.addEventListener('pointerdown', e => {
    if (e.target.closest('#tip-seller')) return;
    dragging = true; moved = false;
    sx = e.clientX; sy = e.clientY; ox = tx; oy = ty;
    stage.classList.add('dragging');
    container.classList.remove('animate');
    stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) + Math.abs(dy) > 4){ moved = true; hideTips(); }
    tx = ox + dx; ty = oy + dy;
    clampPan();
    setTransform(false);
});
stage.addEventListener('pointerup', e => {
    dragging = false; stage.classList.remove('dragging');
    try { stage.releasePointerCapture(e.pointerId); } catch(_){}
});
stage.addEventListener('pointercancel', () => { dragging = false; stage.classList.remove('dragging'); });

/* --- pinch en móvil --- */
let pinch = null;
stage.addEventListener('touchstart', e => {
    if (e.touches.length === 2){
        dragging = false;
        const [a,b] = e.touches;
        pinch = { d: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), z: zoom,
                  cx:(a.clientX+b.clientX)/2, cy:(a.clientY+b.clientY)/2 };
        hideTips();
    }
}, { passive:true });
stage.addEventListener('touchmove', e => {
    if (pinch && e.touches.length === 2){
        e.preventDefault();
        const [a,b] = e.touches;
        const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
        setZoom(pinch.z * (d / pinch.d), pinch.cx, pinch.cy);
    }
}, { passive:false });
stage.addEventListener('touchend', e => { if (e.touches.length < 2) pinch = null; }, { passive:true });

window.addEventListener('keydown', e => {
    if (document.activeElement === document.getElementById('search-input')) return;
    if (e.key === '+' || e.key === '=') setZoom(zoom*1.45, undefined, undefined, true);
    if (e.key === '-' || e.key === '_') setZoom(zoom/1.45, undefined, undefined, true);
    if (e.key === '0') fit(true);
    if (e.key === 'Escape') hideTips();
});
window.addEventListener('resize', () => { const z = zoom; fit(false); setZoom(z); });

/* ============================ TOOLTIPS ============================ */
let tipTimer = null;
function hideTips(){
    tipMesa.classList.remove('show');
    tipSeller.classList.remove('show');
}
function place(tip, rect){
    tip.style.visibility = 'hidden';
    tip.classList.add('show');
    const w = tip.offsetWidth, h = tip.offsetHeight;
    const gap = 12;
    let left = rect.left + rect.width/2 - w/2;
    let top  = rect.top - h - gap;
    if (top < 12) top = rect.bottom + gap;
    if (top + h > window.innerHeight - 12) top = Math.max(12, window.innerHeight - h - 12);
    left = Math.min(window.innerWidth - w - 12, Math.max(12, left));
    tip.style.left = left + 'px';
    tip.style.top  = top + 'px';
    tip.style.visibility = 'visible';
}

/* ============================ MESAS ============================ */
function mesaTip(m){
    const info  = m.dataset.info || '';
    const type  = m.dataset.type || 'collector';
    const p     = C.parseId(info);
    const price = C.priceFor(type);
    const conf  = C.types[type] || C.types.collector;
    const hex   = m._hex;
    const sold  = m.classList.contains('sold');
    const seller= m.dataset.seller || '';
    const label = `${p.zone}${p.num}`;

    tipMesa.style.setProperty('--accent', sold ? C.soldColor : hex);
    tipMesa.style.setProperty('--accent-soft', C.rgba(sold ? C.soldColor : hex, .13));
    tipMesa.style.setProperty('--accent-ink', C.shade(sold ? C.soldColor : hex, .42));

    tipMesa.innerHTML = `
        <div class="t-head">
            <div class="t-id">${label}</div>
            <span class="t-pill">${sold ? C.soldLabel : conf.label.replace(' Table','')}</span>
        </div>
        <div class="t-meta">
            <div class="t-cell"><span class="t-k">Category</span><span class="t-v">${p.catLabel}</span></div>
            <div class="t-cell"><span class="t-k">Zone</span><span class="t-v">${p.zone}</span></div>
            <div class="t-cell"><span class="t-k">Table</span><span class="t-v">${p.num}</span></div>
        </div>
        ${seller ? `<div class="t-seller">Exhibitor · <b>${seller}</b></div>` : ''}
        <div class="t-foot">
            ${sold
                ? `<span class="t-sold">${C.soldLabel}</span>`
                : (price.early
                    ? `<span class="t-old">${price.base}</span><span class="t-new">${price.early}</span><span class="t-eb">${C.earlyBird.label}</span>`
                    : `<span class="t-new">${price.base}</span>`)}
        </div>`;
    place(tipMesa, m.getBoundingClientRect());
}

async function cargarMesas(){
    const resp = await fetch('mesas.html?v=' + Date.now(), { cache:'no-store' });
    capaMesas.innerHTML = await resp.text();

    capaMesas.querySelectorAll('.mesa').forEach(m => {
        const info = m.dataset.info || '';
        dict.set(info, m);
        const type = m.dataset.type || (/COMMERCIAL/i.test(info) ? 'commercial' : 'collector');
        const tone = m.dataset.tone || 'base';
        m.dataset.type = type;
        const hex = C.colorFor(type, tone, m.dataset.color || '');
        m._hex = hex;
        paint(m);
        m.addEventListener('pointerenter', () => { if (!dragging) mesaTip(m); });
        m.addEventListener('pointerleave', () => tipMesa.classList.remove('show'));
    });
}
function paint(m){
    const sold = m.classList.contains('sold');
    const hex = sold ? C.soldColor : m._hex;
    m.style.backgroundColor = C.rgba(hex, sold ? .46 : .34);
    m.style.borderColor = C.rgba(C.shade(hex,.3), .75);
}

/* ============================ SELLERS ============================ */
const IG_ICON = 'https://cdn.shopify.com/s/files/1/0772/3633/9020/files/Instagram_icon_a7c6e898-1b4b-42cf-a525-04f05aea43a2.png?v=1778103647';
const WEB_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 4 9 15 15 0 0 1-4 9 15 15 0 0 1-4-9 15 15 0 0 1 4-9z"/></svg>';

function sellerTip(sp){
    const name = sp.dataset.name || '';
    const ig = sp.dataset.ig || '', web = sp.dataset.web || '';
    tipSeller.innerHTML = `
        <div class="s-tag">Exhibitor</div>
        <div class="s-name">${name}</div>
        <div class="s-links">
            ${ig  ? `<a class="s-btn ig" href="${ig}" target="_blank" rel="noopener"><img src="${IG_ICON}" alt=""> Instagram</a>` : ''}
            ${web ? `<a class="s-btn" href="${web}" target="_blank" rel="noopener">${WEB_ICON} Visit website</a>` : ''}
        </div>`;
    place(tipSeller, sp.getBoundingClientRect());
}

async function cargarSellers(){
    const resp = await fetch('seller.html?v=' + Date.now(), { cache:'no-store' });
    if (!resp.ok) return;
    capaSell.innerHTML = await resp.text();
    capaSell.querySelectorAll('.sponsor-zone').forEach(sp => {
        const name = sp.dataset.name || '', logo = sp.dataset.logo || '';
        const legacy = sp.dataset.dual === 'true';
        const req = sp.dataset.logoLayout || (legacy ? 'dual-vertical' : 'single');
        const counts = {'single':1,'dual-horizontal':2,'dual-vertical':2,'triple-vertical':3,'quad-vertical':4};
        const layout = counts[req] ? req : 'single';
        const cls = layout === 'single' ? 'sponsor-logo-box' : `sponsor-logo-box multi-logo layout-${layout}`;
        sp.innerHTML = `<div class="${cls}">${
            logo ? Array.from({length:counts[layout]}, () => `<img src="${logo}" alt="${name}">`).join('')
                 : `<span style="font-size:9px;font-weight:800;color:#334155">${name}</span>`}</div>`;
        sp.addEventListener('pointerenter', () => { clearTimeout(tipTimer); if (!dragging) sellerTip(sp); });
        sp.addEventListener('pointerleave', () => { tipTimer = setTimeout(() => tipSeller.classList.remove('show'), 260); });
    });
    tipSeller.addEventListener('pointerenter', () => clearTimeout(tipTimer));
    tipSeller.addEventListener('pointerleave', () => tipSeller.classList.remove('show'));
}

/* ============================ HOJA DE CÁLCULO ============================ */
function splitCSV(line){
    return line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(s => s.replace(/^"|"$/g,'').replace(/""/g,'"').trim());
}
async function sincronizar(){
    if (!C.csvUrl) { updateLegend(); return; }
    try{
        const r = await fetch(C.csvUrl + '&cache_ignore=' + Date.now(), { cache:'no-cache', mode:'cors' });
        const lines = (await r.text()).split(/\r?\n/);
        const seen = new Set();
        lines.forEach((row,i) => {
            if (i === 0 || !row.trim()) return;
            const col = splitCSV(row);
            if (col.length < 3) return;
            const estado = (col[1]||'').toUpperCase();
            const id = col[2]||'';
            const m = dict.get(id);
            if (!m) return;
            seen.add(id);
            const sold = estado.includes('VENDIDA') || estado.includes('SOLD');
            m.classList.toggle('sold', sold);
            if (col[3]) m.dataset.seller = col[3];
            paint(m);
        });
        dict.forEach((m,id) => { if (!seen.has(id) && m.classList.contains('sold')){ m.classList.remove('sold'); paint(m); } });
    }catch(err){ console.warn('CSV sync:', err.message); }
    updateLegend();
}

/* ============================ LEYENDA + FILTRO ============================ */
const hidden = new Set();
function updateLegend(){
    const rows = document.getElementById('lg-rows');
    const all = Array.from(dict.values());
    const counts = {};
    Object.keys(C.types).forEach(k => counts[k] = all.filter(m => m.dataset.type === k && !m.classList.contains('sold')).length);
    const soldN = all.filter(m => m.classList.contains('sold')).length;

    const items = Object.keys(C.types).map(k => {
        const col = C.colorFor(k,'base','');
        const p = C.priceFor(k);
        return { key:k, label:C.types[k].label.replace(' Table',''), sw:C.rgba(col,.40),
                 note:(p.early || p.base), n:counts[k] };
    });
    items.push({ key:'sold', label:C.soldLabel, sw:C.rgba(C.soldColor,.46), note:'', n:soldN });

    rows.innerHTML = items.map(it => `
        <div class="lg-row ${hidden.has(it.key)?'off':''}" data-key="${it.key}">
            <span class="lg-sw" style="background:${it.sw}"></span>
            <span>${it.label}${it.note ? ' · ' + it.note : ''}</span>
            <b>${it.n}</b>
        </div>`).join('');
    rows.querySelectorAll('.lg-row').forEach(r => r.onclick = () => toggleFilter(r.dataset.key));

    const eb = document.getElementById('lg-eb');
    if (C.earlyBird.active) eb.textContent = C.earlyBird.label; else eb.style.display = 'none';
}
function toggleFilter(key){
    hidden.has(key) ? hidden.delete(key) : hidden.add(key);
    dict.forEach(m => {
        const k = m.classList.contains('sold') ? 'sold' : m.dataset.type;
        m.classList.toggle('dim', hidden.has(k));
    });
    updateLegend();
}

/* ============================ BUSCADOR ============================ */
const input = document.getElementById('search-input');
const scount = document.getElementById('search-count');
input.addEventListener('input', () => {
    const q = input.value.trim().toUpperCase().replace(/\s+/g,'');
    if (!q){ dict.forEach(m => m.classList.remove('dim')); scount.textContent=''; return; }
    let hits = [];
    dict.forEach((m,id) => {
        const p = C.parseId(id);
        const match = id.replace(/-/g,'').includes(q) || (p.zone + p.num) === q || p.zone === q;
        m.classList.toggle('dim', !match);
        if (match) hits.push(m);
    });
    scount.textContent = hits.length || '0';
    if (hits.length && hits.length <= 24) frame(hits);
});
input.addEventListener('keydown', e => { if (e.key === 'Escape'){ input.value=''; input.dispatchEvent(new Event('input')); input.blur(); } });

function frame(list){
    let l=1e9,t=1e9,r=-1e9,b=-1e9;
    list.forEach(m => {
        const L=parseFloat(m.style.left), T=parseFloat(m.style.top);
        l=Math.min(l,L); t=Math.min(t,T);
        r=Math.max(r,L+parseFloat(m.style.width)); b=Math.max(b,T+parseFloat(m.style.height));
    });
    const iw = mapImg.naturalWidth, ih = mapImg.naturalHeight;
    const pw = (r-l)/100*iw, ph = (b-t)/100*ih;
    const target = Math.min(ZMAX, Math.max(1.6,
        Math.min(window.innerWidth*0.5/(pw*fitScale), window.innerHeight*0.5/(ph*fitScale))));
    zoom = target;
    const s = scale();
    tx = window.innerWidth/2  - ((l+ (r-l)/2)/100*iw)*s;
    ty = window.innerHeight/2 - ((t+ (b-t)/2)/100*ih)*s;
    clampPan(); applyTransform(true);
}

/* ============================ ARRANQUE ============================ */
async function boot(){
    fit(false);
    try { await cargarMesas(); } catch(e){ console.error('mesas.html:', e); }
    try { await cargarSellers(); } catch(e){ console.warn('seller.html:', e); }
    updateLegend();
    sincronizar();
    setInterval(sincronizar, C.csvRefreshMs);
    const ld = document.getElementById('loader');
    ld.classList.add('gone');
    setTimeout(() => ld.remove(), 500);
}
if (mapImg.complete && mapImg.naturalWidth) boot();
else { mapImg.onload = boot; mapImg.onerror = () => { document.getElementById('loader').innerHTML = '<span>No se encuentra ' + C.mapImage + '</span>'; }; }
</script>
